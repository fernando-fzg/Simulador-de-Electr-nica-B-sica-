<style>
/* Mesa de laboratorio: papel de esquema a la izquierda, instrumento oscuro abajo */
:root{
  --paper:#e9eee8;--grid:#d3dcd4;--grid2:#bcc9bf;--panel:#f5f7f2;--panel2:#e3e9e2;--line:#c3cec5;
  --ink:#16292b;--muted:#566a69;--copper:#a94c17;--copper-ink:#fff;--sel:#0a6f8c;
  --v-pos:#c52a2a;--v-neg:#1f5fc0;--v-zero:#16292b;--dot:#d97706;
  --st-act:#15764a;--st-sat:#a94c17;--st-off:#5a6c6a;--st-warn:#a0177a;
  --plot:#fbfcf9;--plot-grid:#dfe6df;--plot-axis:#7d8f8c;--curve:#9bacaa;
  --scr:#0c1d20;--scr-grid:#1f3a3c;--scr-axis:#3a5a5a;--scr-ink:#c9dcd8;
  --ff-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--ff-b:Barlow,"Segoe UI",system-ui,sans-serif;--ff-m:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111b1d;--grid:#1c2a2c;--grid2:#27393b;--panel:#172325;--panel2:#1f2e30;--line:#2f4244;
  --ink:#dbe7e4;--muted:#8fa5a3;--copper:#e8945a;--copper-ink:#1a1006;--sel:#4fc3e0;
  --v-pos:#ff6b5e;--v-neg:#62a2ff;--v-zero:#c7d6d3;--dot:#ffc14d;
  --st-act:#4fd08f;--st-sat:#f0a26c;--st-off:#8fa5a3;--st-warn:#f07fd0;
  --plot:#132022;--plot-grid:#233436;--plot-axis:#6b8280;--curve:#51696a;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111b1d;--grid:#1c2a2c;--grid2:#27393b;--panel:#172325;--panel2:#1f2e30;--line:#2f4244;
  --ink:#dbe7e4;--muted:#8fa5a3;--copper:#e8945a;--copper-ink:#1a1006;--sel:#4fc3e0;
  --v-pos:#ff6b5e;--v-neg:#62a2ff;--v-zero:#c7d6d3;--dot:#ffc14d;
  --st-act:#4fd08f;--st-sat:#f0a26c;--st-off:#8fa5a3;--st-warn:#f07fd0;
  --plot:#132022;--plot-grid:#233436;--plot-axis:#6b8280;--curve:#51696a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font:14px/1.4 var(--ff-b);overflow:hidden}
table{font:inherit;color:inherit;border-collapse:collapse}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ink)}
button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button.pri{background:var(--copper);border-color:var(--copper);color:var(--copper-ink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
select,input[type=text],textarea{background:var(--plot);border:1px solid var(--line);border-radius:3px;padding:4px 6px;min-width:0}
input[type=range]{accent-color:var(--copper);width:100%}
#app{height:100%;display:grid;grid-template-columns:196px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) var(--sh,300px);grid-template-areas:"top top top" "pal cv ins" "pal scope scope"}
header{grid-area:top;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:700 21px/1 var(--ff-d);letter-spacing:.2px;margin-right:6px}
.brand small{display:block;font:500 11px/1.2 var(--ff-d);letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-top:2px}
header .sp{flex:1}
#exSel{max-width:290px}
#status{font:12px var(--ff-m);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lbl{font:600 12px var(--ff-d);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
#pal{grid-area:pal;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:6px 8px 16px}
#pal h3{font:600 12px var(--ff-d);letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:12px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--line)}
#pal h3:first-child{margin-top:2px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pi{display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:1px solid transparent;padding:2px 1px;font:500 11.5px/1.1 var(--ff-d);white-space:normal;text-align:center;min-height:62px}
.pi:hover{border-color:var(--line);background:var(--panel2)}
.pi.on{border-color:var(--copper);background:var(--panel2)}
.pi canvas{width:68px;height:38px;display:block}
#cvw{grid-area:cv;position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
#tools{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;right:8px;pointer-events:none}
#tools>*{pointer-events:auto}
#tools .gap{width:8px}
#hint{position:absolute;left:8px;bottom:8px;right:8px;font:12px var(--ff-b);color:var(--muted);pointer-events:none}
#warn{position:absolute;top:44px;left:8px;right:8px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
#warn div{align-self:flex-start;background:var(--panel);border:1px solid var(--st-warn);color:var(--st-warn);padding:2px 8px;border-radius:3px;font-size:12.5px}
#ins{grid-area:ins;overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:10px 12px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
#ins h2{font:700 19px/1.1 var(--ff-d);margin:0;text-wrap:balance}
#ins h2 small{font:500 13px var(--ff-b);color:var(--muted);margin-left:4px}
#ins p{margin:0;line-height:1.45}
.row{display:flex;gap:4px;flex-wrap:wrap}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:center;gap:6px;margin-bottom:4px}
.fld label{font-size:12.5px;color:var(--muted)}
.fld input[type=text],.fld select{width:100%;font:13px var(--ff-m)}
.fld.bad input{border-color:var(--st-warn)}
.fld.wide{grid-template-columns:1fr}
.reg{border:1px solid var(--line);border-left:4px solid var(--st-off);background:var(--plot);padding:7px 9px;border-radius:3px}
.reg[data-c=act]{border-left-color:var(--st-act)}.reg[data-c=sat]{border-left-color:var(--st-sat)}.reg[data-c=warn]{border-left-color:var(--st-warn)}
.reg b{font:700 16px var(--ff-d);letter-spacing:.6px}
.reg[data-c=act] b{color:var(--st-act)}.reg[data-c=sat] b{color:var(--st-sat)}.reg[data-c=warn] b{color:var(--st-warn)}.reg[data-c=off] b{color:var(--st-off)}
.reg p{font-size:12.5px;margin-top:2px}
table.ro{width:100%;font:12.5px var(--ff-m);font-variant-numeric:tabular-nums}
table.ro td{padding:1px 0;border-bottom:1px solid var(--grid)}
table.ro td:last-child{text-align:right}
table.ro td:first-child{color:var(--muted)}
.chip{font:12px var(--ff-m);padding:2px 7px}
.ws{cursor:pointer}
#semi{display:flex;flex-direction:column;gap:2px}
#semi button{display:flex;justify-content:space-between;gap:8px;background:none;border:0;border-bottom:1px solid var(--grid);border-radius:0;padding:2px 0;text-align:left;font:12.5px var(--ff-m)}
#semi b{font:700 13px var(--ff-d);letter-spacing:.5px}
#semi b[data-c=act]{color:var(--st-act)}#semi b[data-c=sat]{color:var(--st-sat)}#semi b[data-c=off]{color:var(--st-off)}#semi b[data-c=warn]{color:var(--st-warn)}
.warnline{color:var(--st-warn);font-size:12.5px}
#scope{grid-area:scope;display:flex;flex-direction:column;min-height:0;min-width:0;border-top:1px solid var(--line);background:var(--panel);position:relative}
#drag{position:absolute;top:-4px;left:0;right:0;height:8px;cursor:ns-resize;z-index:3;touch-action:none}
#stabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 10px;border-bottom:1px solid var(--line)}
#stabs .tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;font:600 15px var(--ff-d);letter-spacing:.3px;padding:2px 6px;color:var(--muted)}
#stabs .tab.on{color:var(--ink);border-color:var(--copper)}
#stabs label{display:inline-flex;gap:4px;align-items:center}
.pane{flex:1;min-height:0;display:flex;min-width:0}
.pane[hidden]{display:none}
#scw{flex:1;min-width:0;position:relative;background:var(--scr)}
#sc,#bd,#cu{position:absolute;inset:0;width:100%;height:100%}
#chs{width:560px;max-width:50%;overflow:auto;padding:6px 10px;border-left:1px solid var(--line)}
table.ch{width:100%;font:12px var(--ff-m);font-variant-numeric:tabular-nums}
table.ch th{font:600 11px var(--ff-d);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 4px 2px}
table.ch th:first-child,table.ch td:first-child{text-align:left}
table.ch td{padding:2px 4px;text-align:right;border-top:1px solid var(--grid);white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
table.ch select{padding:0 2px;font:11.5px var(--ff-m);width:62px}
table.ch button{padding:0 4px;font:11px var(--ff-m)}
.pw{flex:1;min-width:0;position:relative;background:var(--plot)}
#bdc,#cuc{width:210px;padding:8px 10px;border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
#bdc label{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
#bdc select,#bdc input{width:100%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal>div{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;width:min(620px,100%);display:flex;flex-direction:column;gap:8px}
#modal textarea{width:100%;height:240px;font:12px var(--ff-m)}
@media (max-width:980px){
  body{overflow:auto}
  html,body{height:auto}
  #app{display:flex;flex-direction:column;height:auto}
  header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #exSel{max-width:100%;flex:1 1 200px}
  #cvw{height:62vh;min-height:340px;order:1}
  #pal{order:2;max-height:230px;border-right:0;border-top:1px solid var(--line);padding-left:16px;padding-right:16px}
  .pg{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  #scope{order:3}
  #ins{order:4;border-left:0;border-top:1px solid var(--line);padding-left:16px;padding-right:16px}
  .pane{flex-direction:column}
  #scw,.pw{flex:none;height:260px}
  #chs,#bdc,#cuc{width:100%;max-width:100%;border-left:0;border-top:1px solid var(--line)}
  #drag{display:none}
  #stabs{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<div id="app">

<script>
'use strict';
/* ===== MOTOR: análisis nodal modificado + Newton-Raphson + BDF2 ===== */
const VT=0.02585;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=2*Math.PI;

function luSolve(A,b,n,piv){
  for(let k=0;k<n;k++){
    let p=k,m=Math.abs(A[k][k]);
    for(let i=k+1;i<n;i++){const t=Math.abs(A[i][k]);if(t>m){m=t;p=i}}
    if(m<1e-16)return false;
    if(p!==k){const t=A[p];A[p]=A[k];A[k]=t;const q=b[p];b[p]=b[k];b[k]=q}
    const Ak=A[k],d=Ak[k];
    for(let i=k+1;i<n;i++){
      const Ai=A[i],f=Ai[k]/d;
      if(f===0)continue;
      for(let j=k+1;j<n;j++)Ai[j]-=f*Ak[j];
      b[i]-=f*b[k];
    }
  }
  for(let i=n-1;i>=0;i--){
    let s=b[i];const Ai=A[i];
    for(let j=i+1;j<n;j++)s-=Ai[j]*b[j];
    b[i]=s/Ai[i];
  }
  return true;
}

function pnjlim(vn,vo,nVt,vcrit,s){
  if(vn>vcrit&&Math.abs(vn-vo)>2*nVt){
    s.noncon=true;
    if(vo>0){const a=1+(vn-vo)/nVt;return a>0?vo+nVt*Math.log(a):vcrit}
    return nVt*Math.log(vn/nVt);
  }
  return vn;
}
let _i=0,_g=0;
function pnEval(v,Is,nVt){
  const x=v/nVt,xm=Math.log(1e3/Is);
  if(x>xm){const e=Math.exp(xm);_i=Is*(e*(1+x-xm)-1);_g=Is*e/nVt}
  else{const e=Math.exp(x);_i=Is*(e-1);_g=Is*e/nVt}
  _g+=1e-12;
}
function pnI(v,Is,n){pnEval(v,Is,n*VT);return _i}
/* Unión PN a→k con limitación de paso; st guarda la tensión anterior */
function pnStamp(s,a,k,st,Is,n){
  const nVt=n*VT,vc=nVt*Math.log(nVt/(1.414*Is));
  const v=pnjlim(s.v(a)-s.v(k),st.vl,nVt,vc,s);
  st.vl=v;pnEval(v,Is,nVt);
  s.G(a,k,_g);s.cur(a,k,_i-_g*v);
  st.g=_g;st.ieq=_i-_g*v;
}

function waveVal(p,t,opMode){
  const w=p.wave||'dc',A=p.A||0,off=p.off||0;
  if(w==='dc')return A+off;
  if(opMode&&opMode==='bias')return off;
  const f=p.f||1,ph=(t*f+(p.ph||0)/360)%1,fr=ph<0?ph+1:ph,d=p.duty==null?.5:p.duty;
  switch(w){
    case'sin':return off+A*Math.sin(TAU*fr);
    case'square':return off+(fr<d?A:-A);
    case'tri':return off+A*(fr<.25?4*fr:fr<.75?2-4*fr:4*fr-4);
    case'pulse':return off+(fr<d?A:0);
    case'saw':return off+A*(2*fr-1);
  }
  return off;
}

class Sim{
  constructor(nNodes,devs){
    this.nNodes=nNodes;this.N=nNodes;this.devs=devs;this.t=0;this.h=1e-5;this.mode='dc';
    this.order=1;this.src=1;this.opMode='t0';this.nonconv=0;this.singular=false;this.gmin=1e-10;
    this.a0=1;this.a1=1;this.a2=0;this.restart=true;this.noncon=false;this.changed=false;
    devs.forEach(d=>d.setup(this));
    const n=this.N;
    this.A=[];for(let i=0;i<n;i++)this.A.push(new Float64Array(n));
    this.b=new Float64Array(n);this.x=new Float64Array(n);this.nx=new Float64Array(n);this.xs=new Float64Array(n);
  }
  alloc(){return this.N++}
  v(n){return n<0?0:this.x[n]}
  add(r,c,v){if(r>=0&&c>=0)this.A[r][c]+=v}
  rhs(r,v){if(r>=0)this.b[r]+=v}
  G(a,b,g){this.add(a,a,g);this.add(b,b,g);this.add(a,b,-g);this.add(b,a,-g)}
  cur(a,b,I){this.rhs(a,-I);this.rhs(b,I)}
  vs(a,b,br,V){this.add(a,br,1);this.add(b,br,-1);this.add(br,a,1);this.add(br,b,-1);this.rhs(br,V)}
  assemble(){
    const n=this.N,A=this.A;
    for(let i=0;i<n;i++)A[i].fill(0);
    this.b.fill(0);
    for(let i=0;i<this.nNodes;i++)A[i][i]+=this.gmin;
    for(const d of this.devs)d.stamp(this);
  }
  newton(maxIt){
    const n=this.N,x=this.x,nx=this.nx;
    for(let it=0;it<maxIt;it++){
      this.noncon=false;
      this.assemble();
      nx.set(this.b);
      if(!luSolve(this.A,nx,n)){this.singular=true;return false}
      let conv=true;
      for(let i=0;i<n;i++){
        const d=nx[i]-x[i];
        if(!isFinite(nx[i]))return false;
        const tol=(i<this.nNodes?1e-6:1e-9)+1e-5*Math.abs(nx[i]);
        if(Math.abs(d)>tol)conv=false;
      }
      if(it>=24){const k=it>=36?.15:.4;for(let i=0;i<n;i++)x[i]+=k*(nx[i]-x[i])}else x.set(nx);
      if(conv&&!this.noncon&&it>0)return true;
    }
    return false;
  }
  setCoef(){
    if(this.order===1){this.a0=1;this.a1=1;this.a2=0}
    else{this.a0=1.5;this.a1=2;this.a2=.5}
  }
  solveOP(){
    this.mode='dc';this.singular=false;
    const save=this.gmin;let ok=this.newton(120);

class Relay extends Dev{
  /* n = [bobina a, bobina b, común, NA, NC] */
  setup(s){this.br=s.alloc();this.i1=0;this.i2=0;this.on=false}
  reset(){this.on=false}
  ic(s){return s.x[this.br]}
  stamp(s){
    const[a,b,c,no,nc]=this.n,br=this.br,{L,Rc}=this.p;
    s.add(a,br,1);s.add(b,br,-1);s.add(br,a,1);s.add(br,b,-1);s.add(br,br,-Rc);
    if(s.mode==='tran'){s.add(br,br,-L*s.a0/s.h);s.rhs(br,-L*(s.a1*this.i1-s.a2*this.i2)/s.h)}
    s.G(c,no,this.on?20:1e-10);s.G(c,nc,this.on?1e-10:20);
  }
  accept(s){
    const i=this.ic(s),p=this.p;
    if(s.mode==='tran'){this.i2=this.i1;this.i1=i}else this.i1=this.i2=i;
    if(!this.on&&Math.abs(i)>p.Ion){this.on=true;s.changed=true}
    else if(this.on&&Math.abs(i)<p.Ioff){this.on=false;s.changed=true}
  }
  ac(a,w){a.add(this.br,this.br,-w*this.p.L)}
  iPins(s){const[,,c,no,nc]=this.n,i=this.ic(s),a=(s.v(c)-s.v(no))*(this.on?20:1e-10),b=(s.v(c)-s.v(nc))*(this.on?1e-10:20);return[i,-i,a+b,-a,-b]}
  signals(s){const[a,b]=this.n;return{'I bobina':()=>this.ic(s),'V bobina':()=>s.v(a)-s.v(b)}}
  region(s){return this.on?{t:'ACTIVADO',c:'act',why:`I bobina ${fmt(this.ic(s),'A')}: el contacto común pasa a NA.`}:{t:'REPOSO',c:'off',why:'Sin corriente suficiente: común conectado a NC.'}}
  info(s){const[a,b]=this.n;return[['V bobina',s.v(a)-s.v(b),'V'],['I bobina',this.ic(s),'A']]}
}
class DAC extends Dev{
  /* n = [d3,d2,d1,d0,salida] */
  setup(s){this.br=s.alloc();this.code=0}
  reset(){this.code=0}
  stamp(s){s.vs(this.n[4],-1,this.br,this.p.Vref*this.code/16)}
  accept(s){let c=0;for(let i=0;i<4;i++)c=c*2+(s.v(this.n[i])>this.p.Vth?1:0);if(c!==this.code){this.code=c;s.changed=true}}
  iPins(s){return[0,0,0,0,s.x[this.br]]}
  signals(s){return{Vout:()=>s.v(this.n[4])}}
  region(){return{t:'CÓDIGO '+this.code.toString(2).padStart(4,'0'),c:'act',why:`Vout = Vref · ${this.code}/16.`}}
  info(s){return[['Código',this.code,''],['Vout',s.v(this.n[4]),'V'],['1 LSB',this.p.Vref/16,'V']]}
}
class ADC extends Dev{
  /* n = [entrada,d3,d2,d1,d0] */
  setup(){this.code=0;this.next=0}
  reset(){this.code=0;this.next=0}
  stamp(s){
    const p=this.p;s.G(this.n[0],-1,1e-6);
    for(let i=0;i<4;i++){const b=this.code>>(3-i)&1,d=this.n[i+1];s.G(d,-1,.01);s.rhs(d,b?.01*p.Vout:0)}
  }
  accept(s){
    if(s.mode==='tran'&&s.t<this.next)return;
    const p=this.p,c=clamp(Math.floor(s.v(this.n[0])/p.Vref*16),0,15);
    this.next=s.t+1/p.fs;
    if(c!==this.code){this.code=c;s.changed=true}
  }
  iPins(s){return[s.v(this.n[0])*1e-6,...[0,1,2,3].map(i=>(s.v(this.n[i+1])-(this.code>>(3-i)&1)*this.p.Vout)*.01)]}
  signals(s){return{Vin:()=>s.v(this.n[0])}}
  region(){return{t:'CÓDIGO '+this.code.toString(2).padStart(4,'0'),c:'act',why:`Decimal ${this.code} de 15.`}}
  info(s){return[['Vin',s.v(this.n[0]),'V'],['Código',this.code,''],['1 LSB',this.p.Vref/16,'V']]}
}

function makeDev(c,n){
  switch(c.type){
    case'NPN':return new BJT(c,n,{pol:1});
    case'PNP':return new BJT(c,n,{pol:-1});
    case'NMOS':case'NDEP':return new FET(c,n,{pol:1});

    case'NJF':return new FET(c,n,{pol:1,jfet:true});

  }
  return new MODELS[c.type](c,n);
}

/* Formato e interpretación de valores SI */
function fmt(v,u){
  if(v==null||!isFinite(v))return'—';
  const a=Math.abs(v);
  if(a<1e-13)return'0 '+(u||'');
  const T=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
  for(const[m,x]of T)if(a>=m*.9995)return parseFloat((v/m).toPrecision(3))+' '+x+(u||'');
  return v.toExponential(1)+' '+(u||'');
}
function fmt0(v,u){const s=fmt(v,u);return s}
function parseSI(t){
  t=String(t).trim().replace(',','.').replace(/(Hz|V\/s|[ΩVAHFsW°%])$/,'').trim().replace('µ','u');
  const m=t.match(/^([-+]?[\d.]+(?:e[-+]?\d+)?)\s*(meg|[pnumkKMG])?$/i);
  if(!m)return NaN;
  const M={p:1e-12,n:1e-9,u:1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9,meg:1e6,U:1e-6,N:1e-9,P:1e-12};
  return parseFloat(m[1])*(m[2]?M[m[2]]:1);
}

/* --- Geometría --- */
const key=(x,y)=>x+','+y;
function xf(c,p){let[x,y]=p;if(c.flip)y=-y;for(let i=0;i<(c.rot||0);i++){const t=x;x=-y;y=t}return[c.x+x,c.y+y]}
const pinsOf=c=>T[c.type].pins.map(p=>xf(c,p));
function boxOf(c){const b=T[c.type].box,a=xf(c,[b[0],b[1]]),d=xf(c,[b[2],b[3]]);return[Math.min(a[0],d[0]),Math.min(a[1],d[1]),Math.max(a[0],d[0]),Math.max(a[1],d[1])]}
const world=e=>{const r=cv.getBoundingClientRect(),v=st.view;return[(e.clientX-r.left-v.x)/v.z/GRID,(e.clientY-r.top-v.y)/v.z/GRID]};

/* Deja los cables partidos en cada unión: dos puntos conectan solo si comparten extremo */
function normalize(){
  let W=st.wires.filter(w=>w[0]!==w[2]||w[1]!==w[3]);
  const pts=new Map();
  const addp=(x,y)=>pts.set(key(x,y),[x,y]);
  W.forEach(w=>{addp(w[0],w[1]);addp(w[2],w[3])});
  st.comps.forEach(c=>pinsOf(c).forEach(p=>addp(p[0],p[1])));
  const out=[];
  for(const w of W){
    const[x1,y1,x2,y2]=w,cuts=[];
    for(const p of pts.values()){
      if(x1===x2&&p[0]===x1&&p[1]>Math.min(y1,y2)&&p[1]<Math.max(y1,y2))cuts.push(p);
      else if(y1===y2&&p[1]===y1&&p[0]>Math.min(x1,x2)&&p[0]<Math.max(x1,x2))cuts.push(p);
    }
    cuts.sort((a,b)=>(a[0]-x1)**2+(a[1]-y1)**2-(b[0]-x1)**2-(b[1]-y1)**2);
    let a=[x1,y1];
    for(const c of cuts){out.push([a[0],a[1],c[0],c[1]]);a=c}
    out.push([a[0],a[1],x2,y2]);
  }
  const seen=new Map();
  for(const w of out){
    const k=key(w[0],w[1])<key(w[2],w[3])?key(w[0],w[1])+'|'+key(w[2],w[3]):key(w[2],w[3])+'|'+key(w[0],w[1]);
    seen.set(k,w);
  }
  W=[...seen.values()];
  const pinset=new Set();st.comps.forEach(c=>pinsOf(c).forEach(p=>pinset.add(key(p[0],p[1]))));
  let merged=true;
  while(merged){
    merged=false;
    const at=new Map();
    W.forEach((w,i)=>{for(const k of[key(w[0],w[1]),key(w[2],w[3])]){if(!at.has(k))at.set(k,[]);at.get(k).push(i)}});
    for(const[k,l]of at){
      if(l.length!==2||pinset.has(k))continue;
      const a=W[l[0]],b=W[l[1]],ha=a[1]===a[3],hb=b[1]===b[3];
      if(ha!==hb)continue;
      const far=(w)=>key(w[0],w[1])===k?[w[2],w[3]]:[w[0],w[1]],p=far(a),q=far(b);
      W[l[0]]=[p[0],p[1],q[0],q[1]];W.splice(l[1],1);merged=true;break;
    }
  }
  st.wires=W;
}
function reroute(wires,map,moving){
  const R=[];
  for(const w of wires){
    const a=key(w[0],w[1]),b=key(w[2],w[3]),ma=map.get(a),mb=map.get(b);
    if(!ma&&!mb){R.push(w);continue}
    if(ma&&mb){R.push([ma[0],ma[1],mb[0],mb[1]]);if((ma[0]!==mb[0])&&(ma[1]!==mb[1])){R.pop();R.push([ma[0],ma[1],mb[0],ma[1]],[mb[0],ma[1],mb[0],mb[1]])}continue}
    const fix=ma?[w[2],w[3]]:[w[0],w[1]],mv=ma||mb,hor=w[1]===w[3];
    if(fix[0]===mv[0]||fix[1]===mv[1]){R.push([fix[0],fix[1],mv[0],mv[1]]);continue}
    const cr=hor?[fix[0],mv[1]]:[mv[0],fix[1]];
    R.push([fix[0],fix[1],cr[0],cr[1]],[cr[0],cr[1],mv[0],mv[1]]);
  }
  return R;
}

/* --- Compilación a red eléctrica --- */
function compile(){
  const par=new Map(),find=k=>{if(!par.has(k))par.set(k,k);let r=k;while(par.get(r)!==r)r=par.get(r);while(par.get(k)!==r){const n=par.get(k);par.set(k,r);k=n}return r},
    uni=(a,b)=>par.set(find(a),find(b));
  st.wires.forEach(w=>uni(key(w[0],w[1]),key(w[2],w[3])));
  let hasG=false;
  st.comps.forEach(c=>{pinsOf(c).forEach(p=>find(key(p[0],p[1])));if(c.type==='GND'){const k=key(...pinsOf(c)[0]);uni(k,'#G');hasG=true}});
  warns=[];
  let gr=find('#G');
  if(!hasG&&st.comps.length){
    const v=st.comps.find(c=>c.type==='V')||st.comps[0],pl=pinsOf(v);gr=find(key(...pl[pl.length-1]));
    if(st.comps.some(c=>c.type!=='GND'))warns.push('Agrega una tierra: sin ella los voltajes se miden desde un pin de '+v.name+'.');
  }
  const idx=new Map();let nn=0;
  const nodeOf=k=>{const r=find(k);if(r===gr)return-1;if(!idx.has(r))idx.set(r,nn++);return idx.get(r)};
  keyNode=new Map();
  for(const k of[...par.keys()])if(k!=='#G')keyNode.set(k,nodeOf(k));
  devOf=new Map();
  const devs=st.comps.map(c=>{const d=makeDev(c,pinsOf(c).map(p=>nodeOf(key(p[0],p[1]))));devOf.set(c.id,d);return d});
  sim=new Sim(nn,devs);
  if(st.comps.length){
    const ok=sim.dcop();
    if(sim.singular)warns.push('Circuito sin solución: revisa fuentes en paralelo o en cortocircuito.');
    else if(!ok)warns.push('No se encontró el punto de reposo. La simulación parte desde cero.');
  }
  buildGraph();setH();bindChans();resetScope();
  saveLocal();st.dirtyUI=true;bdCache=null;cuCache=null;bdFill();
}
function setH(){
  const base=st.tdiv/100;let fmax=0;
  for(const c of st.comps){if(c.type==='V'&&c.p.wave!=='dc')fmax=Math.max(fmax,c.p.f);if(c.type==='ADC')fmax=Math.max(fmax,c.p.fs/4)}
  const h=fmax?Math.min(base,1/(fmax*80)):base;
  recEvery=Math.max(1,Math.round(base/h));

/* --- Grafo de cables para repartir corrientes --- */
function buildGraph(){
  const vs=new Map(),V=k=>{if(!vs.has(k))vs.set(k,{e:[],pins:[],gnd:false});return vs.get(k)};
  st.wires.forEach((w,i)=>{V(key(w[0],w[1])).e.push(i);V(key(w[2],w[3])).e.push(i)});
  st.comps.forEach(c=>{pinsOf(c).forEach((p,i)=>{const v=V(key(...p));if(c.type==='GND')v.gnd=true;else v.pins.push([c.id,i])})});

}
function wireCurrents(){
  const{vs,wc}=graph;wc.fill(0);
  const S=new Map(),deg=new Map(),used=new Uint8Array(st.wires.length),Q=[];
  for(const[k,v]of vs){
    let s=0;for(const[id,i]of v.pins){const d=devOf.get(id);if(d)s+=d.iPins(sim)[i]||0}
    S.set(k,s);deg.set(k,v.e.length);if(v.e.length===1&&!v.gnd)Q.push(k);
  }
  while(Q.length){
    const k=Q.pop();if(deg.get(k)!==1)continue;
    const ei=vs.get(k).e.find(i=>!used[i]);if(ei==null)continue;
    used[ei]=1;
    const w=st.wires[ei],isA=key(w[0],w[1])===k,o=isA?key(w[2],w[3]):key(w[0],w[1]),s=S.get(k);
    wc[ei]=isA?-s:s;
    S.set(o,S.get(o)+s);deg.set(k,0);deg.set(o,deg.get(o)-1);
    if(deg.get(o)===1&&!vs.get(o).gnd)Q.push(o);
  }
}

function niceDiv(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;return(m<=1?1:m<=2?2:m<=5?5:10)*e}

function stats(ch,a,b){

  ctx.fillStyle=colors.ink;ctx.font='600 13px '+FF;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(yl,X+4,Y+1);ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText(xl,X+W-2,Y+H-2);
}
function curDev(){
  const c=st.sel&&st.sel.comp;
  if(c&&T[c.type].curves)return devOf.get(c.id);
  const q=st.comps.find(o=>['NPN','PNP','NJF','PJF','NMOS','PMOS','NDEP','PHOTO'].includes(o.type))||st.comps.find(o=>T[o.type].curves);
  return q?devOf.get(q.id):null;
}
function drawCurves(now){
  const can=$('cu'),ctx=can.getContext('2d'),[W,H]=resize(can,ctx);
  ctx.fillStyle=colors.plot;ctx.fillRect(0,0,W,H);
  const d=curDev();
  if(!d){ctx.fillStyle=colors.muted;ctx.font='14px '+FF;ctx.textAlign='center';ctx.fillText('Selecciona un diodo, transistor, OpAmp o tiristor.',W/2,H/2);$('cuc').innerHTML='';return}
  if(!cuCache||cuCache.d!==d||now-cuT>400){
    cuT=now;d.prepLoad&&d.prepLoad(sim);
    const ll=d.forceTo?sim.loadLine(d):null;
    const save=sim.x.slice();cuCache={d,c:d.curves(sim,ll)};
    const r=d.region(sim);
    $('cuc').innerHTML=`<b>${esc(d.c.name)}</b><span style="color:var(--muted)">${esc(T[d.c.type].n)}</span>${r?`<div class="reg" data-c="${r.c}"><b>${esc(r.t)}</b></div>`:''}`+
      (d.Q&&cuCache.c.q?`<table class="ro"><tr><td>Punto Q ${esc(cuCache.c.xl)}</td><td>${fmt(cuCache.c.q[0],cuCache.c.xu)}</td></tr><tr><td>Punto Q ${esc(cuCache.c.yl)}</td><td>${fmt(cuCache.c.q[1],cuCache.c.yu)}</td></tr>${ll&&isFinite(ll.vth)?`<tr><td>Corte con eje V</td><td>${fmt(ll.vth,'V')}</td></tr><tr><td>Corte con eje I</td><td>${fmt(ll.isc,'A')}</td></tr>`:''}</table>`:'')+
      (ll?'<span style="color:var(--muted)">La recta de carga es la de continua: capacitores abiertos y fuentes alternas en su offset.</span>':'');
  }
  const{c}=cuCache,tr=c.transfer&&W>560,gapW=tr?Math.min(260,W*.32):0;
  const X=58,Y=10,PW=W-X-14-gapW-(tr?54:0),PH=H-Y-26,xr=c.xr,yr=c.yr;
  const px=v=>X+(v-xr[0])/(xr[1]-xr[0])*PW,py=v=>Y+PH-(v-yr[0])/(yr[1]-yr[0])*PH;
  plotFrame(ctx,X,Y,PW,PH,xr,yr,c.xl,c.yl,c.xu,c.yu);
  ctx.save();ctx.beginPath();ctx.rect(X,Y,PW,PH);ctx.clip();
  for(const s of c.series){
    ctx.strokeStyle=s.main?colors.copper:colors.curve;ctx.lineWidth=s.main?2:1.4;if(s.dash)ctx.setLineDash([4,4]);
    ctx.beginPath();s.pts.forEach((p,i)=>{const a=px(p[0]),b=py(p[1]);i?ctx.lineTo(a,b):ctx.moveTo(a,b)});ctx.stroke();ctx.setLineDash([]);
  }
  if(c.ll&&isFinite(c.ll.slope)){
    ctx.strokeStyle=colors.sel;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(px(xr[0]),py(c.ll.isc+c.ll.slope*xr[0]));ctx.lineTo(px(xr[1]),py(c.ll.isc+c.ll.slope*xr[1]));ctx.stroke();
  }
  ctx.restore();
  ctx.font='12px '+FF;ctx.textBaseline='middle';ctx.textAlign='right';
  for(const s of c.series)if(s.label&&!s.dash){const p=s.pts[s.pts.length-1];const y=py(p[1]);if(y>Y+8&&y<Y+PH-4){ctx.fillStyle=s.main?colors.ink:colors.muted;ctx.fillText(s.label,X+PW-3,y-8)}}
  if(d&&c.q){
    const q=d.Q&&!c.xl.startsWith('Vd')&&false?null:liveQ(d,c);
    const a=px(clamp(q[0],xr[0],xr[1])),b=py(clamp(q[1],yr[0],yr[1]));
    ctx.fillStyle=colors.plot;ctx.beginPath();ctx.arc(a,b,7,0,TAU);ctx.fill();ctx.fillStyle=colors.sel;ctx.beginPath();ctx.arc(a,b,5,0,TAU);ctx.fill();
    ctx.fillStyle=colors.ink;ctx.font='600 13px '+FF;ctx.textAlign=a>X+PW-40?'right':'left';ctx.textBaseline='bottom';ctx.fillText('Q',a+(a>X+PW-40?-9:9),b-5);
  }
  if(c.ll&&isFinite(c.ll.slope)){ctx.fillStyle=colors.sel;ctx.font='600 12.5px '+FF;ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('recta de carga',X+PW-4,Y+3)}
  if(tr){
    const t=c.transfer,X2=X+PW+54,PW2=gapW,xs=t.pts.map(p=>p[0]),r2=[Math.min(...xs),Math.max(...xs)],ym=yr[1];
    plotFrame(ctx,X2,Y,PW2,PH,r2,[0,ym],t.xl,'Id (transferencia)','V','A');
    const p2=v=>X2+(v-r2[0])/(r2[1]-r2[0])*PW2,p3=v=>Y+PH-v/ym*PH;
    ctx.save();ctx.beginPath();ctx.rect(X2,Y,PW2,PH);ctx.clip();ctx.strokeStyle=colors.copper;ctx.lineWidth=2;ctx.beginPath();t.pts.forEach((p,i)=>{i?ctx.lineTo(p2(p[0]),p3(p[1])):ctx.moveTo(p2(p[0]),p3(p[1]))});ctx.stroke();ctx.restore();
    const v=d.vals(sim),gx=p2(clamp(v.vgs*d.pol,r2[0],r2[1])),gy=p3(clamp(Math.abs(v.id),0,ym));
    ctx.fillStyle=colors.sel;ctx.beginPath();ctx.arc(gx,gy,5,0,TAU);ctx.fill();
  }
}
function liveQ(d,c){
  const f=c.xl;
  if(d instanceof BJT&&!(d instanceof Opto)){const v=d.vals(sim);return[Math.abs(v.vce),Math.abs(v.ic)]}
  if(d instanceof FET){const v=d.vals(sim);return[Math.abs(v.vds),Math.abs(v.id)]}
  if(d.curves){const q=d.curves(sim,null);return q?q.q:c.q}
  return c.q;
}

/* --- Bode --- */
let bdCache=null,bdHover=null;
function bdFill(){
  const a=$('bIn'),b=$('bOut');
  const src=st.comps.filter(c=>c.type==='V'&&c.p.wave!=='dc').concat(st.comps.filter(c=>c.type==='V'&&c.p.wave==='dc'));
  const pa=a.value,pb=b.value;
  a.innerHTML=src.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const outs=[];st.chans.forEach((c,i)=>{if(c.node)outs.push([String(i),c.name]);else if(c.u==='V')outs.push([String(i),c.name])});
  const nodes=st.comps.filter(c=>c.type==='R'||c.type==='C'||c.type==='L');
  nodes.forEach(c=>outs.push(['c:'+c.id,'V('+c.name+')']));
  b.innerHTML=outs.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('');
  if([...a.options].some(o=>o.value===pa))a.value=pa;if([...b.options].some(o=>o.value===pb))b.value=pb;
  if(st.example&&st.example.bodeOut!=null&&b.options.length)b.value=String(st.example.bodeOut);
}
function runBode(){
  if(!sim)return;
  const src=devOf.get($('bIn').value),o=$('bOut').value,f1=parseSI($('bF1').value),f2=parseSI($('bF2').value);
  if(!src||!o||!(f1>0)||!(f2>f1)){$('bRes').textContent='Elige entrada y salida. Revisa el rango de frecuencias.';bdCache={r:[]};return}
  let A=-1,B=-1;
  if(o.startsWith('c:')){const d=devOf.get(o.slice(2));A=d.n[0];B=d.n[1]}
  else{const c=st.chans[+o];if(c.node)A=keyNode.get(key(...c.node));else{const d=devOf.get(c.id);A=d.n[d.n.length-1]}}
  const r=sim.bode(src,A,B,f1,f2,180);bdCache={r};
  if(!r.length){$('bRes').textContent='No se pudo calcular.';return}
  const mx=r.reduce((m,p)=>p.db>m.db?p:m,r[0]),cuts=[];
  for(let i=1;i<r.length;i++){const a=r[i-1].db-(mx.db-3),b=r[i].db-(mx.db-3);if(a*b<0)cuts.push(r[i-1].f*Math.pow(r[i].f/r[i-1].f,a/(a-b)))}
  bdCache.cuts=cuts;bdCache.mx=mx;
  $('bRes').innerHTML=`<table class="ro"><tr><td>Ganancia máx.</td><td>${mx.db.toFixed(1)} dB</td></tr><tr><td>a</td><td>${fmt(mx.f,'Hz')}</td></tr>${cuts.map((f,i)=>`<tr><td>Corte −3 dB ${cuts.length>1?i+1:''}</td><td>${fmt(f,'Hz')}</td></tr>`).join('')}</table>`;
}
function drawBode(){
  const can=$('bd'),ctx=can.getContext('2d'),[W,H]=resize(can,ctx);
  ctx.fillStyle=colors.plot;ctx.fillRect(0,0,W,H);
  if(!bdCache)runBode();
  const r=bdCache&&bdCache.r;
  if(!r||!r.length){ctx.fillStyle=colors.muted;ctx.font='14px '+FF;ctx.textAlign='center';ctx.fillText('Necesita una fuente de entrada y un canal de salida.',W/2,H/2);return}
  const X=62,Y=10,PW=W-X-16,PH=(H-Y-30)/2-4,lf=r.map(p=>Math.log10(p.f)),x0=lf[0],x1=lf[lf.length-1];
  const dbs=r.map(p=>p.db);let d0=Math.floor(Math.max(Math.min(...dbs),Math.max(...dbs)-80)/10)*10,d1=Math.ceil(Math.max(...dbs)/10+.01)*10;
  const frame=(Y0,yr,yl,yu,tk)=>{
    ctx.strokeStyle=colors['plot-grid'];ctx.lineWidth=1;ctx.font='11.5px '+FM;
    for(let e=Math.ceil(x0);e<=x1;e++){const px=X+(e-x0)/(x1-x0)*PW;ctx.beginPath();ctx.moveTo(px,Y0);ctx.lineTo(px,Y0+PH);ctx.stroke();if(Y0>Y){ctx.fillStyle=colors.muted;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(fmt(Math.pow(10,e),'Hz'),px,Y0+PH+4)}}
    ctx.textAlign='right';ctx.textBaseline='middle';
    for(let v=Math.ceil(yr[0]/tk)*tk;v<=yr[1]+.01;v+=tk){const py=Y0+PH-(v-yr[0])/(yr[1]-yr[0])*PH;ctx.beginPath();ctx.moveTo(X,py);ctx.lineTo(X+PW,py);ctx.stroke();ctx.fillStyle=colors.muted;ctx.fillText(v.toFixed(0)+yu,X-5,py)}
    ctx.fillStyle=colors.ink;ctx.font='600 13px '+FF;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(yl,X+4,Y0+1);
  };
  const line=(Y0,yr,get)=>{ctx.save();ctx.beginPath();ctx.rect(X,Y0,PW,PH);ctx.clip();ctx.strokeStyle=colors.copper;ctx.lineWidth=2;ctx.beginPath();r.forEach((p,i)=>{const a=X+(lf[i]-x0)/(x1-x0)*PW,b=Y0+PH-(get(p)-yr[0])/(yr[1]-yr[0])*PH;i?ctx.lineTo(a,b):ctx.moveTo(a,b)});ctx.stroke();ctx.restore()};
  const tk=niceDiv((d1-d0)/5);frame(Y,[d0,d1],'Magnitud',' dB',tk);line(Y,[d0,d1],p=>p.db);
  const Y2=Y+PH+8,ps=r.map(p=>p.ph);let unw=[...ps];for(let i=1;i<unw.length;i++){while(unw[i]-unw[i-1]>180)unw[i]-=360;while(unw[i]-unw[i-1]<-180)unw[i]+=360}
  r.forEach((p,i)=>p.un=unw[i]);const p0=Math.floor(Math.min(...unw)/45)*45-(Math.min(...unw)===Math.max(...unw)?45:0),p1=Math.ceil(Math.max(...unw)/45)*45+(Math.min(...unw)===Math.max(...unw)?45:0);
  frame(Y2,[p0,p1],'Fase','°',Math.max(45,niceDiv((p1-p0)/4)));line(Y2,[p0,p1],p=>p.un);
  (bdCache.cuts||[]).forEach(f=>{const a=X+(Math.log10(f)-x0)/(x1-x0)*PW;ctx.strokeStyle=colors.sel;ctx.setLineDash([4,4]);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(a,Y);ctx.lineTo(a,Y+PH);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=colors.sel;ctx.font='600 12.5px '+FF;ctx.textAlign=a>W-100?'right':'left';ctx.textBaseline='top';ctx.fillText('fc '+fmt(f,'Hz'),a+(a>W-100?-5:5),Y+16)});
  if(bdHover!=null){
    const f=clamp((bdHover-X)/PW,0,1),i=Math.round(f*(r.length-1)),a=X+(lf[i]-x0)/(x1-x0)*PW,p=r[i];
    ctx.strokeStyle=colors['plot-axis'];ctx.beginPath();ctx.moveTo(a,Y);ctx.lineTo(a,Y2+PH);ctx.stroke();
    const t=`${fmt(p.f,'Hz')}   ${p.db.toFixed(1)} dB   ${p.un.toFixed(0)}°`;ctx.font='12px '+FM;const tw=ctx.measureText(t).width+12,bx=a+tw+12>W?a-tw-6:a+6;
    ctx.fillStyle=colors.ink;ctx.fillRect(bx,Y+PH-22,tw,20);ctx.fillStyle=colors.plot;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(t,bx+6,Y+PH-12);
  }
}

/* --- Pestañas y controles --- */
function setTab(t){
  st.tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('pO').hidden=t!=='o';$('pC').hidden=t!=='c';$('pB').hidden=t!=='b';$('octl').style.display=t==='o'?'flex':'none';
  cuCache=null;if(t==='b'){bdFill();bdCache=null}
}
function setRun(r){st.run=r;$('bRun').textContent=r?'Pausar':'Simular';$('bRun').classList.toggle('pri',true)}
function flash(m){warnsTemp=m;tflash=performance.now()+3500}
let warnsTemp='';
function setTdiv(v){st.tdiv=v;$('tdiv').value=String(v);if(sim){setH();resetScope()}saveLocal()}
function clearAll(){st.comps=[];st.wires=[];st.chans=[];st.sel=null;st.example=null;$('exSel').value='';compile();uiSel();fit()}
function serialize(){return JSON.stringify({c:st.comps,w:st.wires,ch:st.chans.map(chSave),td:st.tdiv})}
function loadJSON(s){
  const o=JSON.parse(s);if(!o.c||!o.w)throw 0;
  for(const c of o.c)if(!T[c.type])throw 0;
  pushUndo();st.comps=o.c;st.wires=o.w;st.chans=(o.ch||[]).map(chLoad);st.sel=null;st.example=null;$('exSel').value='';
  st.nextId=1+o.c.reduce((m,c)=>Math.max(m,+String(c.id).replace(/\D/g,'')||0),0);
  if(o.td)st.tdiv=o.td;$('tdiv').value=String(st.tdiv);compile();uiSel();fit();
}
function saveLocal(){try{if(!st.example||st.touched)localStorage.setItem('banco-eb',serialize())}catch(e){}}
function buildUI(){
  buildPalette();
  const td=$('tdiv');TDIVS.forEach(v=>{const o=document.createElement('option');o.value=String(v);o.textContent=fmt(v,'s');td.append(o)});
  td.onchange=()=>setTdiv(+td.value);
  $('bRun').onclick=()=>setRun(!st.run);
  $('bReset').onclick=()=>{if(sim){sim.dcop();sim.t=0;resetScope()}};
  $('bNew').onclick=()=>{pushUndo();clearAll()};
  $('bUndo').onclick=undo;
  $('spd').oninput=()=>{st.speed=Math.pow(2,+$('spd').value)};
  $('tSel').onclick=()=>setTool('sel');$('tWire').onclick=()=>setTool('wire');$('tProbe').onclick=()=>setTool('probe');
  $('tVolt').onclick=e=>{st.showV=!st.showV;e.target.classList.toggle('on',st.showV)};
  $('tCur').onclick=e=>{st.showI=!st.showI;e.target.classList.toggle('on',st.showI)};
  $('tFit').onclick=fit;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  $('bGo').onclick=()=>{bdCache=null;runBode()};
  $('bIO').onclick=()=>{$('ioT').value=serialize();$('ioMsg').textContent='';$('modal').hidden=false};
  $('ioClose').onclick=()=>$('modal').hidden=true;
  $('ioCopy').onclick=()=>{const t=$('ioT');navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t.value).then(()=>$('ioMsg').textContent='Copiado',()=>{t.select();$('ioMsg').textContent='Selecciona y copia con Ctrl+C'}):t.select()};
  $('ioLoad').onclick=()=>{try{loadJSON($('ioT').value);$('modal').hidden=true}catch(e){$('ioMsg').textContent='Ese texto no es un circuito válido.'}};
  const sel=$('exSel');
  sel.innerHTML='<option value="">Circuitos del curso…</option>'+EX_GROUPS.map(g=>`<optgroup label="${esc(g[0])}">${g[1].map(e=>`<option value="${EXAMPLES.indexOf(e)}">${esc(e.t)}</option>`).join('')}</optgroup>`).join('');
  sel.onchange=()=>{if(sel.value!==''){pushUndo();loadExample(EXAMPLES[+sel.value])}};
  $('sc').addEventListener('pointermove',e=>{const r=$('sc').getBoundingClientRect();scHover=e.clientX-r.left});
  $('sc').addEventListener('pointerleave',()=>scHover=null);
  $('bd').addEventListener('pointermove',e=>{const r=$('bd').getBoundingClientRect();bdHover=e.clientX-r.left});
  $('bd').addEventListener('pointerleave',()=>bdHover=null);
  const dr=$('drag');let dy=null;
  dr.onpointerdown=e=>{dr.setPointerCapture(e.pointerId);dy=[e.clientY,$('scope').getBoundingClientRect().height]};
  dr.onpointermove=e=>{if(dy)$('app').style.setProperty('--sh',clamp(dy[1]+dy[0]-e.clientY,150,window.innerHeight-220)+'px')};
  dr.onpointerup=()=>dy=null;
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',readTheme);
  new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('resize',()=>{});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawPalette);
  readTheme();hint();
}

/* --- Ejemplos --- */
function loadExample(e){
  st.comps=[];st.wires=[];st.chans=[];st.sel=null;st.example=e;st.touched=false;
  const by={};
  for(const[type,name,x,y,rot,flip,p,model]of e.comps){
    const c=newComp(type,x,y,rot,flip,p,name,null);
    if(model){c.model=model;const m=T[type].models&&T[type].models.find(q=>q[0]===model);if(m)c.p={...T[type].def,...m[1],...(p||{})}}
    by[name]=c;st.comps.push(c);
  }
  const pt=s=>{if(Array.isArray(s))return s;const[n,i]=s.split('.'),c=by[n];const pn=T[c.type].pins,j=isNaN(+i)?(T[c.type].pn||[]).indexOf(i):+i;return xf(c,pn[j])};
  for(const path of e.wires){
    let a=null,vert=false;
    for(let s of path){
      if(s==='|'){vert=true;continue}
      const b=pt(s);
      if(a){
        const cr=vert?[a[0],b[1]]:[b[0],a[1]];
        st.wires.push([a[0],a[1],cr[0],cr[1]],[cr[0],cr[1],b[0],b[1]]);
      }
      a=b;vert=false;
    }
  }
  normalize();
  st.tdiv=e.tdiv||1e-3;$('tdiv').value=String(st.tdiv);
  st.chans=[];compile();
  for(const c of e.ch||[]){
    if(typeof c==='string'){
      if(c.includes(':')){const[n,sig]=c.split(':');st.chans.push(chLoad({id:by[n].id,sig}))}
      else st.chans.push(chLoad({node:pt(c)}));
    }
  }
  bindChans();resetScope();
  uiSel();setTimeout(fit,0);fit();bdFill();
  $('exSel').value=String(EXAMPLES.indexOf(e));
  if(e.xy)$('smode').value='xy';else $('smode').value='yt';
  warm();
}
/* Llena una pantalla al cargar para que el osciloscopio no aparezca vacío */
function warm(){
  if(!sim||!st.comps.length)return;
  const t0=performance.now();
  while(scN<SCREEN*2.2&&performance.now()-t0<140)doStep();
}

/* --- Bucle --- */
let tui=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!colors.ink)return;
  const dt=Math.min(now-lastT,60)/1000;lastT=now;
  if(st.run&&sim&&sim.N&&st.comps.length&&!(drag&&drag.c)&&!st.wire){
    owed+=dt*(10*st.tdiv/(2.5/st.speed))/sim.h;
    const t0=performance.now();
    while(owed>=1&&performance.now()-t0<13){doStep();owed--}
    if(owed>3000)owed=0;
    phase+=dt*.9;
  }
  draw();
  if(st.tab==='o')drawScope();else if(st.tab==='c')drawCurves(now);else drawBode();
  if(now-tui>180){
    tui=now;
    if(st.dirtyUI)uiSel();else liveUI();
    if(st.tab==='o')chTable();
    const w=[...warns];if(warnsTemp&&now<tflash)w.push(warnsTemp);
    if(sim&&sim.nonconv>0&&sim.N)w.push('Algunos pasos no convergieron: reduce Tiempo/div o revisa el circuito.');
    const h=w.map(x=>`<div>${esc(x)}</div>`).join('');if($('warn')._h!==h){$('warn')._h=h;$('warn').innerHTML=h}
    $('status').textContent=sim?`t ${fmt(sim.t,'s')} · paso ${fmt(sim.h,'s')}`:'';
  }
}
function boot(){
  buildUI();
  loadExample(EXAMPLES.find(e=>e.boot)||EXAMPLES[0]);
  try{const s=localStorage.getItem('banco-eb');if(s){loadJSON(s);st.undo=[]}}catch(e){}
  requestAnimationFrame(t=>{lastT=t;frame(t)});
}

boot();
</script>
